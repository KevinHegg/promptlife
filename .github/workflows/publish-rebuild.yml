name: Publish the rebuild preview

# The Pages site is deployed by main's "Deploy GitHub Pages" workflow, which also builds this
# branch into /promptlife/next/. Pushing here asks that workflow to run again.
on:
  push:
    branches: [rebuild]
  workflow_dispatch:

permissions:
  actions: write

jobs:
  redeploy:
    runs-on: ubuntu-latest
    steps:
      - name: Run the Pages deploy on main
        run: gh workflow run deploy-pages.yml --ref main --repo "$GITHUB_REPOSITORY"
        env:
          GH_TOKEN: ${{ github.token }}
