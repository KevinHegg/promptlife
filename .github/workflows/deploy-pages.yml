name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Verify calculations, lessons, and reading progress
        run: npm test

      - name: Build
        run: npm run build:pages

      - name: Verify Pages paths
        run: node scripts/verify-build.mjs

      # The subway-map rebuild lives on the `rebuild` branch and is published beside this site
      # at /promptlife/next/. Its own workflow re-runs this one whenever that branch changes.
      - name: Check out the rebuild branch
        uses: actions/checkout@v4
        with:
          ref: rebuild
          path: rebuild-src

      - name: Build the rebuild into /next/
        working-directory: rebuild-src
        run: |
          npm ci
          npm run typecheck
          npm test
          npx vite build --base=/promptlife/next/ --outDir ../dist/next --emptyOutDir

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
